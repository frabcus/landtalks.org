<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}</title>
  <meta name="description" content="{{ page.description | escape }}">
  <link rel="icon" type="image/png" href="/images/icon.png">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}/images/season-artwork.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <div class="wrap masthead__bar">
      <a class="masthead__mark" href="/">Land&nbsp;Talks</a>
      <div class="masthead__nav">
        <a class="masthead__link" href="/talks/"{% if page.url == "/talks/" %} aria-current="page"{% endif %}>Talks</a>
        <a class="btn" href="https://lu.ma/landtalks">Get tickets</a>
      </div>
    </div>
  </header>

  {{ content }}

  <footer class="foot">
    <div class="wrap foot__grid">
      <div>
        <p class="foot__mark">Land Talks</p>
        <p class="foot__note">Reimagining land for a more abundant Britain.</p>
      </div>
      <ul>
        <li><a href="/talks/">Talks</a></li>
        <li><a href="https://lu.ma/landtalks">Tickets &amp; dates</a></li>
        <li><a href="https://landtalks.notion.site/">Information for speakers</a></li>
      </ul>
    </div>
  </footer>
</body>
</html>
